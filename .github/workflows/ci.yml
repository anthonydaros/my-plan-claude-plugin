name: ci

on:
  push:
    branches: [main]
  pull_request:

# A superseded run proves nothing worth paying for — cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Linux runners only, deliberately: macos-latest bills at 10× and
# windows-latest at 2×, and together they produced a real GitHub charge.
# smoke-windows.ps1 stays in the repository for running locally on a
# Windows machine; reintroducing a non-Linux runner here must be the
# explicit point of a change, never a side effect.
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Static checks (POSIX)
        run: sh tests/smoke-posix.sh

  manifests:
    # The host's own validator is the authority on manifest shape. Our checks can
    # drift from it; this step cannot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifest
        run: claude plugin validate ./plugin

      - name: Validate marketplace manifest
        run: claude plugin validate .

  codex-marketplace:
    # Codex CLI has no validate subcommand. Installing from an isolated local
    # marketplace exercises the real ingestion and cache path instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Isolate Codex state
        run: |
          mkdir -p "$RUNNER_TEMP/codex-home"
          echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Add the repository marketplace
        run: codex plugin marketplace add .

      - name: Discover the Codex plugin
        run: |
          listing=$(codex plugin list --available --json)
          printf '%s\n' "$listing" | jq -e '.available[] | select(.pluginId == "my-plan@my-plan-codex")'

      - name: Install and inspect the Codex plugin
        run: |
          result=$(codex plugin add my-plan@my-plan-codex --json)
          installed=$(printf '%s\n' "$result" | jq -r '.installedPath')
          test -f "$installed/.codex-plugin/plugin.json"
          test -f "$installed/plugin.json"
          test -f "$installed/skills/map/SKILL.md"
          test -f "$installed/skills/map/agents/openai.yaml"
          test -f "$installed/skills/commit/SKILL.md"
          test -f "$installed/skills/commit/agents/openai.yaml"
          test -f "$installed/skills/cleanup/SKILL.md"
          test -f "$installed/skills/cleanup/agents/openai.yaml"
          test -f "$installed/skills/security/SKILL.md"
          test -f "$installed/skills/security/agents/openai.yaml"
          test -f "$installed/knowledge/checklists/review.md"
          test -f "$installed/knowledge/checklists/cleanup.md"
          test -f "$installed/knowledge/checklists/security.md"

  gemini-skills:
    # Antigravity has no headless installer to exercise here; Gemini CLI shares
    # Google's skill format and does. Linking is the sanctioned install (a copy
    # severs the ../../knowledge references), so this proves the real ingestion
    # path and that those references survive the symlink.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Link every skill and prove the references resolve
        run: |
          for s in map plan implement review commit cleanup security; do
            gemini skills link "./plugin/skills/$s" --consent
          done
          listing=$(gemini skills list)
          for s in map plan implement review commit cleanup security; do
            printf '%s\n' "$listing" | grep -q "$s \[Enabled\]"
          done
          test -L ~/.gemini/skills/review
          test -f ~/.gemini/skills/review/../../knowledge/checklists/review.md
          test -f ~/.gemini/skills/implement/../review/SKILL.md
