name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Static checks (POSIX)
        if: runner.os != 'Windows'
        run: sh tests/smoke-posix.sh

      - name: Static checks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/smoke-windows.ps1

  manifests:
    # The host's own validator is the authority on manifest shape. Our checks can
    # drift from it; this step cannot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifest
        run: claude plugin validate ./plugin

      - name: Validate marketplace manifest
        run: claude plugin validate .
