name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Static checks (POSIX)
        if: runner.os != 'Windows'
        run: sh tests/smoke-posix.sh

      - name: Static checks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/smoke-windows.ps1

  manifests:
    # The host's own validator is the authority on manifest shape. Our checks can
    # drift from it; this step cannot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin manifest
        run: claude plugin validate ./plugin

      - name: Validate marketplace manifest
        run: claude plugin validate .

  codex-marketplace:
    # Codex CLI has no validate subcommand. Installing from an isolated local
    # marketplace exercises the real ingestion and cache path instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Isolate Codex state
        run: |
          mkdir -p "$RUNNER_TEMP/codex-home"
          echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Add the repository marketplace
        run: codex plugin marketplace add .

      - name: Discover the Codex plugin
        run: |
          listing=$(codex plugin list --available --json)
          printf '%s\n' "$listing" | jq -e '.available[] | select(.pluginId == "my-plan@my-plan-codex")'

      - name: Install and inspect the Codex plugin
        run: |
          result=$(codex plugin add my-plan@my-plan-codex --json)
          installed=$(printf '%s\n' "$result" | jq -r '.installedPath')
          test -f "$installed/.codex-plugin/plugin.json"
          test -f "$installed/skills/map/SKILL.md"
          test -f "$installed/skills/map/agents/openai.yaml"
          test -f "$installed/skills/commit/SKILL.md"
          test -f "$installed/skills/commit/agents/openai.yaml"
          test -f "$installed/skills/cleanup/SKILL.md"
          test -f "$installed/skills/cleanup/agents/openai.yaml"
          test -f "$installed/knowledge/checklists/review.md"
          test -f "$installed/knowledge/checklists/cleanup.md"
